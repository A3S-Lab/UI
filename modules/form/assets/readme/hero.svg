<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">A3S Form - AI Native Form Designer</title>
  <desc id="desc">A3S Form turns one versioned schema, user-interface definition, and rule set into a controlled visual Designer and deterministic runtime Renderer. AI submits reviewable typed patches while the host owns data and actions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101118"/>
      <stop offset="0.62" stop-color="#151725"/>
      <stop offset="1" stop-color="#1d1436"/>
    </linearGradient>
    <linearGradient id="brand" x1="58" y1="36" x2="1138" y2="414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2587f5"/>
      <stop offset="0.5" stop-color="#3b53dc"/>
      <stop offset="1" stop-color="#7137d8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#6ca3ff"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <path d="M0 376H1200" stroke="#2a2d35"/>
  <path d="M500 0V376" stroke="#2a2d35"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(58 42)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="98" height="82" rx="18" stroke="url(#brand)" stroke-width="8"/>
      <path d="M28 31H78M28 53H68M28 75H57" stroke="#f2f3f5" stroke-width="7"/>
      <path d="M82 67L101 86L116 45" stroke="url(#brand)" stroke-width="9"/>
    </g>

    <text x="194" y="71" fill="#a4a8b2" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="18" font-weight="700" letter-spacing="2">AI NATIVE FORM DESIGNER</text>
    <text x="58" y="190" fill="#f2f3f5" font-size="62" font-weight="760" letter-spacing="-3">A3S Form</text>
    <text x="58" y="245" fill="#f2f3f5" font-size="31" font-weight="720" letter-spacing="-1">One form contract.</text>
    <text x="58" y="287" fill="url(#brand)" font-size="31" font-weight="720" letter-spacing="-1">Designed by people + AI.</text>

    <g transform="translate(58 319)">
      <rect width="392" height="58" rx="10" fill="#171820" stroke="#3a3d48"/>
      <text x="20" y="36" fill="#6ca3ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="19" font-weight="700">DESIGN</text>
      <text x="94" y="36" fill="#707581" font-size="20">/</text>
      <text x="117" y="36" fill="#f2f3f5" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="19" font-weight="700">COMPILE</text>
      <text x="204" y="36" fill="#707581" font-size="20">/</text>
      <text x="227" y="36" fill="#f2f3f5" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="19" font-weight="700">RENDER</text>
    </g>
  </g>

  <g id="designer-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="548" y="49" fill="#a4a8b2" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="18" font-weight="700" letter-spacing="1.6">SCHEMA -> PLAN -> CONTROLLED UI</text>

    <rect x="534" y="72" width="600" height="281" rx="14" fill="#151720" stroke="#3a3d48"/>
    <rect x="534" y="72" width="600" height="42" rx="14" fill="#171820"/>
    <circle cx="558" cy="93" r="5" fill="#6ca3ff"/>
    <text x="574" y="99" fill="#f2f3f5" font-size="17" font-weight="700">Registration form</text>
    <text x="999" y="99" fill="#8c83ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="14" font-weight="700">REV 12</text>
    <text x="1061" y="99" fill="#6ca3ff" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="14" font-weight="700">VALID</text>

    <rect x="552" y="130" width="142" height="205" rx="10" fill="#12141c" stroke="#2a2d35"/>
    <text x="568" y="157" fill="#a4a8b2" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="14" font-weight="700">FIELDS</text>
    <rect x="568" y="173" width="110" height="35" rx="8" fill="#111d32" stroke="#2864e8"/>
    <text x="581" y="196" fill="#f2f3f5" font-size="15">Text input</text>
    <rect x="568" y="218" width="110" height="35" rx="8" fill="#171820" stroke="#3a3d48"/>
    <text x="581" y="241" fill="#f2f3f5" font-size="15">Select</text>
    <rect x="568" y="263" width="110" height="35" rx="8" fill="#171820" stroke="#3a3d48"/>
    <text x="581" y="286" fill="#f2f3f5" font-size="15">Repeater</text>

    <rect x="710" y="130" width="254" height="205" rx="10" fill="#f7f8fa"/>
    <text x="728" y="158" fill="#20232b" font-size="17" font-weight="700">Create your account</text>
    <text x="728" y="190" fill="#555b66" font-size="13">Email</text>
    <rect x="728" y="200" width="218" height="34" rx="7" fill="#ffffff" stroke="#c9cdd4"/>
    <text x="740" y="222" fill="#9298a3" font-size="13">name@example.com</text>
    <text x="728" y="258" fill="#555b66" font-size="13">Team size</text>
    <rect x="728" y="268" width="218" height="34" rx="7" fill="#ffffff" stroke="#6ca3ff" stroke-width="2"/>
    <text x="740" y="290" fill="#555b66" font-size="13">1 - 10</text>
    <rect x="841" y="312" width="105" height="9" rx="4.5" fill="url(#brand)"/>

    <rect x="980" y="130" width="136" height="205" rx="10" fill="#12141c" stroke="#2a2d35"/>
    <text x="996" y="157" fill="#a4a8b2" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="14" font-weight="700">INSPECT</text>
    <text x="996" y="188" fill="#707581" font-size="13">Widget</text>
    <text x="996" y="207" fill="#f2f3f5" font-size="14">select</text>
    <text x="996" y="237" fill="#707581" font-size="13">Required</text>
    <rect x="996" y="247" width="38" height="20" rx="10" fill="#2864e8"/>
    <circle cx="1024" cy="257" r="7" fill="#ffffff"/>
    <rect x="996" y="285" width="104" height="34" rx="8" fill="#1b1530" stroke="#7137d8"/>
    <text x="1008" y="307" fill="#ad87ff" font-size="13" font-weight="700">AI patch +2</text>

    <path d="M694 232H700" stroke="#6ca3ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M964 232H970" stroke="#6ca3ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M534 354H1134" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g id="foundation" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="417" fill="#a4a8b2" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1.4">FORM CONTRACT</text>
    <text x="234" y="417" fill="#f2f3f5" font-size="19" font-weight="680">Schema</text>
    <text x="322" y="417" fill="#f2f3f5" font-size="19" font-weight="680">UI</text>
    <text x="366" y="417" fill="#f2f3f5" font-size="19" font-weight="680">Rules</text>
    <text x="438" y="417" fill="#f2f3f5" font-size="19" font-weight="680">Actions</text>
    <text x="580" y="417" fill="#a4a8b2" font-family="'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="1.4">HOST CONTROL</text>
    <text x="748" y="417" fill="#f2f3f5" font-size="19" font-weight="680">Data</text>
    <text x="810" y="417" fill="#f2f3f5" font-size="19" font-weight="680">Identity</text>
    <text x="900" y="417" fill="#f2f3f5" font-size="19" font-weight="680">Submit</text>
    <text x="980" y="417" fill="#f2f3f5" font-size="19" font-weight="680">Side effects</text>
    <path d="M58 441H1142" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
