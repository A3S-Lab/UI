name: Deploy A3S UI Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install package dependencies
        run: npm ci

      - name: Build component package
        run: npm run build

      - name: Install documentation dependencies
        run: npm ci --prefix site

      - name: Type-check documentation
        run: npm run typecheck --prefix site

      - name: Build documentation
        run: npm run build --prefix site

      - name: Verify documentation output
        run: npm run check:site --prefix site

      - name: Install A3S Test browser runtime
        env:
          A3S_TEST_VERSION: v0.4.4
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/a3s-test-runtime"
          mkdir -p "$runtime/bin" "$runtime/browser"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            "https://github.com/A3S-Lab/Test/releases/download/$A3S_TEST_VERSION/install.sh" \
            -o "$runtime/install-a3s-test.sh"
          sh "$runtime/install-a3s-test.sh" \
            --version "$A3S_TEST_VERSION" \
            --install-dir "$runtime/bin" \
            --cli-only
          npm install \
            --prefix "$runtime/browser" \
            --no-save \
            --no-package-lock \
            agent-browser@0.26.0
          chmod +x \
            "$runtime/browser/node_modules/agent-browser/bin/agent-browser-linux-x64"
          "$runtime/bin/a3s-test" capabilities \
            --browser-driver standalone \
            --browser-executable \
              "$runtime/browser/node_modules/agent-browser/bin/agent-browser-linux-x64" \
            --json

      - name: Test documentation with A3S Test
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/a3s-test-runtime"
          a3s_test="$runtime/bin/a3s-test"
          browser="$runtime/browser/node_modules/agent-browser/bin/agent-browser-linux-x64"
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          export AGENT_BROWSER_EXECUTABLE_PATH="$chrome"
          export AGENT_BROWSER_COLOR_SCHEME=light

          node site/node_modules/@rspress/core/bin/rspress.js \
            preview --host 127.0.0.1 --port 4178 \
            > "$RUNNER_TEMP/a3s-ui-preview.log" 2>&1 &
          preview_pid=$!
          cleanup_preview() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup_preview EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4178/UI/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          "$a3s_test" check tests/e2e/documentation-ui.acl --json
          "$a3s_test" run tests/e2e/documentation-ui.acl \
            --browser-driver standalone \
            --browser-executable "$browser" \
            --command-timeout-ms 30000 \
            --idle-timeout-ms 60000 \
            --cleanup-timeout-ms 15000 \
            --infrastructure-retries 0 \
            --max-parallel-scenarios 1 \
            --json | tee "$RUNNER_TEMP/a3s-test-result.json"

      - name: Upload A3S Test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: a3s-test-evidence
          path: |
            .a3s-test/runs
            ${{ runner.temp }}/a3s-test-result.json
            ${{ runner.temp }}/a3s-ui-preview.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/doc_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
