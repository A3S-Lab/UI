<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>A3S responsive preview fixture</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f5f7fa;
        --paper: #ffffff;
        --ink: #17191d;
        --muted: #667085;
        --line: #e4e7ec;
        --blue: #2864e8;
        --blue-soft: #eef4ff;
        --green: #15815a;
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 240px;
        min-height: 100dvh;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
      }

      button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
      }

      button:focus-visible {
        outline: 3px solid rgb(40 100 232 / 28%);
        outline-offset: 2px;
      }

      .fixture-shell {
        display: grid;
        min-height: 100dvh;
        grid-template-columns: 188px minmax(0, 1fr);
      }

      .fixture-nav {
        display: flex;
        min-width: 0;
        padding: 16px 12px;
        border-inline-end: 1px solid var(--line);
        background: var(--paper);
        flex-direction: column;
        gap: 20px;
      }

      .fixture-brand {
        display: flex;
        min-height: 36px;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        font-weight: 700;
      }

      .fixture-brand span:first-child {
        display: grid;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        background: var(--blue);
        color: #ffffff;
        place-items: center;
      }

      .fixture-nav nav {
        display: grid;
        gap: 4px;
      }

      .fixture-nav a {
        display: flex;
        min-height: 36px;
        padding: 0 9px;
        border-radius: 6px;
        align-items: center;
        color: var(--muted);
        font-size: 13px;
        font-weight: 550;
        text-decoration: none;
      }

      .fixture-nav a[aria-current="page"] {
        background: var(--blue-soft);
        color: var(--blue);
      }

      .fixture-nav footer {
        display: flex;
        margin-top: auto;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 11px;
      }

      .fixture-status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
      }

      .fixture-main {
        display: grid;
        min-width: 0;
        grid-template-rows: auto 1fr;
      }

      .fixture-header {
        display: flex;
        min-width: 0;
        min-height: 58px;
        padding: 10px clamp(14px, 3vw, 28px);
        border-block-end: 1px solid var(--line);
        background: var(--paper);
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .fixture-header h1,
      .fixture-header p {
        margin: 0;
      }

      .fixture-header h1 {
        overflow: hidden;
        font-size: 15px;
        font-weight: 680;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .fixture-header p {
        margin-top: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .fixture-content {
        display: grid;
        min-width: 0;
        padding: clamp(18px, 4vw, 40px);
        align-content: start;
        gap: 24px;
      }

      .fixture-intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
      }

      .fixture-intro h2,
      .fixture-intro p {
        margin: 0;
      }

      .fixture-intro h2 {
        max-width: 15ch;
        font-size: clamp(22px, 5vw, 42px);
        font-weight: 680;
        letter-spacing: -0.035em;
        line-height: 1.08;
      }

      .fixture-intro p {
        max-width: 48ch;
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .fixture-viewport {
        flex: none;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        white-space: nowrap;
      }

      .fixture-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(220px, 0.7fr);
        gap: 16px;
      }

      .fixture-panel {
        min-width: 0;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--paper);
      }

      .fixture-panel header {
        display: flex;
        margin-bottom: 16px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .fixture-panel h3,
      .fixture-panel p {
        margin: 0;
      }

      .fixture-panel h3 {
        font-size: 14px;
        font-weight: 650;
      }

      .fixture-panel small {
        color: var(--muted);
        font-size: 11px;
      }

      .fixture-list {
        display: grid;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .fixture-list li {
        display: grid;
        min-width: 0;
        padding: 12px 0;
        border-block-start: 1px solid var(--line);
        grid-template-columns: 9px minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
      }

      .fixture-list li:first-child {
        border-block-start: 0;
      }

      .fixture-list i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--blue);
      }

      .fixture-list strong,
      .fixture-list span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .fixture-list strong {
        font-size: 12px;
      }

      .fixture-list span {
        color: var(--muted);
        font-size: 11px;
      }

      .fixture-properties {
        display: grid;
        margin: 0;
      }

      .fixture-properties div {
        display: grid;
        padding: 10px 0;
        border-block-start: 1px solid var(--line);
        grid-template-columns: 1fr auto;
        gap: 12px;
      }

      .fixture-properties div:first-child {
        border-block-start: 0;
      }

      .fixture-properties dt,
      .fixture-properties dd {
        margin: 0;
        font-size: 11px;
      }

      .fixture-properties dt {
        color: var(--muted);
      }

      .fixture-properties dd {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      @media (max-width: 760px) {
        .fixture-shell {
          padding-bottom: 58px;
          grid-template-columns: minmax(0, 1fr);
        }

        .fixture-nav {
          position: fixed;
          inset: auto 0 0;
          z-index: 2;
          display: block;
          padding: 7px 10px;
          border-block-start: 1px solid var(--line);
          border-inline-end: 0;
        }

        .fixture-brand,
        .fixture-nav footer {
          display: none;
        }

        .fixture-nav nav {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 5px;
        }

        .fixture-nav a {
          min-height: 42px;
          justify-content: center;
          text-align: center;
        }

        .fixture-header {
          min-height: 52px;
        }

        .fixture-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      @media (max-width: 480px) {
        .fixture-header button {
          display: none;
        }

        .fixture-content {
          gap: 20px;
        }

        .fixture-intro {
          align-items: start;
          flex-direction: column;
        }

        .fixture-panel {
          padding: 14px;
        }

        .fixture-list li {
          grid-template-columns: 9px minmax(0, 1fr);
        }

        .fixture-list li > span:last-child {
          display: none;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --canvas: #111318;
          --paper: #191c22;
          --ink: #f2f4f7;
          --muted: #a8b0be;
          --line: #303640;
          --blue: #6ca3ff;
          --blue-soft: #1e2d4a;
          --green: #59c49b;
        }
      }
    </style>
  </head>
  <body>
    <div class="fixture-shell">
      <aside class="fixture-nav">
        <div class="fixture-brand"><span>A</span><span>A3S Preview</span></div>
        <nav aria-label="Preview navigation">
          <a href="#workspace" aria-current="page" data-i18n="workspace">工作区</a>
          <a href="#activity" data-i18n="activity">活动</a>
          <a href="#settings" data-i18n="settings">设置</a>
        </nav>
        <footer><span class="fixture-status-dot"></span><span data-i18n="ready">预览已连接</span></footer>
      </aside>
      <main class="fixture-main">
        <header class="fixture-header">
          <div>
            <h1 data-i18n="title">响应式工作区</h1>
            <p data-i18n="subtitle">调整模拟器尺寸以检查布局变化</p>
          </div>
          <button type="button" data-i18n="action">新建任务</button>
        </header>
        <div class="fixture-content">
          <section class="fixture-intro">
            <div>
              <h2 data-i18n="headline">真实视口，清晰断点。</h2>
              <p data-i18n="description">此夹具会读取 iframe 的实际 CSS 视口，并在手机、平板与桌面布局之间切换。</p>
            </div>
            <output class="fixture-viewport" aria-live="polite">393 × 852 · phone</output>
          </section>
          <div class="fixture-grid">
            <section class="fixture-panel">
              <header><h3 data-i18n="recent">最近任务</h3><small data-i18n="updated">刚刚更新</small></header>
              <ul class="fixture-list">
                <li><i></i><strong data-i18n="taskOne">检查响应式布局</strong><span data-i18n="running">运行中</span></li>
                <li><i></i><strong data-i18n="taskTwo">整理组件契约</strong><span data-i18n="complete">已完成</span></li>
                <li><i></i><strong data-i18n="taskThree">验证键盘路径</strong><span data-i18n="queued">排队中</span></li>
              </ul>
            </section>
            <aside class="fixture-panel">
              <header><h3 data-i18n="viewport">视口属性</h3><small>CSS px</small></header>
              <dl class="fixture-properties">
                <div><dt data-i18n="width">宽度</dt><dd data-property="width">393</dd></div>
                <div><dt data-i18n="height">高度</dt><dd data-property="height">852</dd></div>
                <div><dt data-i18n="orientation">方向</dt><dd data-property="orientation">portrait</dd></div>
                <div><dt data-i18n="breakpoint">布局</dt><dd data-property="breakpoint">phone</dd></div>
              </dl>
            </aside>
          </div>
        </div>
      </main>
    </div>
    <script>
      const copy = {
        en: {
          action: "New task",
          activity: "Activity",
          breakpoint: "Layout",
          complete: "Complete",
          description:
            "This fixture reads the iframe's real CSS viewport and switches between phone, tablet, and desktop layouts.",
          headline: "Real viewport. Clear breakpoints.",
          height: "Height",
          orientation: "Orientation",
          queued: "Queued",
          ready: "Preview connected",
          recent: "Recent tasks",
          running: "Running",
          settings: "Settings",
          subtitle: "Resize the simulator to inspect layout changes",
          taskOne: "Inspect responsive layout",
          taskThree: "Verify keyboard paths",
          taskTwo: "Organize component contracts",
          title: "Responsive workspace",
          updated: "Updated now",
          viewport: "Viewport properties",
          width: "Width",
          workspace: "Workspace",
        },
        zh: {
          action: "新建任务",
          activity: "活动",
          breakpoint: "布局",
          complete: "已完成",
          description: "此夹具会读取 iframe 的实际 CSS 视口，并在手机、平板与桌面布局之间切换。",
          headline: "真实视口，清晰断点。",
          height: "高度",
          orientation: "方向",
          queued: "排队中",
          ready: "预览已连接",
          recent: "最近任务",
          running: "运行中",
          settings: "设置",
          subtitle: "调整模拟器尺寸以检查布局变化",
          taskOne: "检查响应式布局",
          taskThree: "验证键盘路径",
          taskTwo: "整理组件契约",
          title: "响应式工作区",
          updated: "刚刚更新",
          viewport: "视口属性",
          width: "宽度",
          workspace: "工作区",
        },
      };

      const params = new URLSearchParams(location.search);
      const language = params.get("lang") === "en" ? "en" : "zh";
      document.documentElement.lang = language === "en" ? "en" : "zh-CN";
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const key = element.dataset.i18n;
        if (copy[language][key]) element.textContent = copy[language][key];
      });

      const renderViewport = () => {
        const width = document.documentElement.clientWidth;
        const height = document.documentElement.clientHeight;
        const breakpoint = width < 600 ? "phone" : width < 1100 ? "tablet" : "desktop";
        const orientation = width > height ? "landscape" : "portrait";
        document.querySelector(".fixture-viewport").textContent = `${width} × ${height} · ${breakpoint}`;
        document.querySelector('[data-property="width"]').textContent = width;
        document.querySelector('[data-property="height"]').textContent = height;
        document.querySelector('[data-property="orientation"]').textContent = orientation;
        document.querySelector('[data-property="breakpoint"]').textContent = breakpoint;
      };

      addEventListener("resize", renderViewport);
      window.visualViewport?.addEventListener("resize", renderViewport);
      renderViewport();
    </script>
  </body>
</html>
